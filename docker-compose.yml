version: "3.9"

# Local-development services for the Citi MLOps Plane.
# Run:
#   docker compose up -d
# then point the backend at it via .env (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    container_name: citi-mlops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlops
      POSTGRES_PASSWORD: mlops
      POSTGRES_DB: mlops
    ports:
      - "5432:5432"
    volumes:
      - mlops_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlops", "-d", "mlops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mlops_pg_data:
