# Alembic configuration for the Citi MLOps Plane database.
# Run from studio/backend/:
#   alembic -c alembic_mlops.ini upgrade head
#   alembic -c alembic_mlops.ini revision --autogenerate -m "..."

[alembic]
script_location = alembic_mlops
prepend_sys_path = .
sqlalchemy.url =

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
