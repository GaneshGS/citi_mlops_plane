[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "citi-mlops-plane"
version = "0.1.0"
description = "Citi MLOps Plane — recipes, experiments, GSSP-GS, and Stellar-driven fine-tuning."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
keywords = ["citi", "mlops", "llm", "fine-tuning", "experiments"]
authors = [
    { name = "Citi MLOps Plane" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Information Technology",
    "Private :: Do Not Upload",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "httpx>=0.27,<1.0",
    "boto3>=1.34,<2.0",
    "pyjwt>=2.8",
    "structlog>=24.1.0",
    "diceware",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["mlops_plane/backend"]
include = ["mlops*", "auth*", "loggers*", "routes*", "utils*", "alembic_mlops*"]
exclude = ["__pycache__", "_LEGACY_DELETE_ME*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E402", "E501", "F401"]
